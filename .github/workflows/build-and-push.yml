name: Build and Push Docker Image

on:
  workflow_run:
    workflows: ["Request Ephemeral Runner"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  handoff:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      kind: ${{ steps.validate.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reject consumer reruns before artifact retrieval
        id: policy
        run: python3 ci/online_shop.py policy --phase handoff
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: ${{ steps.policy.outputs.request_artifact }}
          path: ${{ runner.temp }}/request
      - name: Validate triggering run and attempt
        id: validate
        run: python3 ci/online_shop.py validate --handoff "$RUNNER_TEMP/request/request.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.policy.outputs.validated_artifact }}
          path: ${{ runner.temp }}/request/
          if-no-files-found: error

  build:
    needs: handoff
    # A partial rerun can reuse successful needs without rerunning handoff.
    # Route all retry attempts to hosted capacity, where the policy fails explicitly.
    runs-on: ${{ github.run_attempt == 1 && fromJSON('["self-hosted", "gce", "ephemeral"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reject partial job reruns before artifacts or registry credentials
        id: policy
        run: python3 ci/online_shop.py policy --phase build
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.policy.outputs.validated_artifact }}
          path: ${{ runner.temp }}/request
      - name: Revalidate handoff on runner
        run: python3 ci/online_shop.py validate --handoff "$RUNNER_TEMP/request/request.json"
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish sample
        if: needs.handoff.outputs.kind == 'sample'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build -f application/Dockerfile -t "$DOCKERHUB_USERNAME/ci-artifact:latest" application
          docker push "$DOCKERHUB_USERNAME/ci-artifact:latest"
      - name: Set up BuildKit for upstream cache mounts
        if: needs.handoff.outputs.kind == 'online-shop'
        uses: docker/setup-buildx-action@v3
      - name: Build, publish and verify selected Online Shop components
        if: needs.handoff.outputs.kind == 'online-shop'
        run: python3 ci/online_shop.py build --handoff "$RUNNER_TEMP/request/request.json" --source "$RUNNER_TEMP/aml-build" --output "$RUNNER_TEMP/build-evidence"
      - uses: actions/upload-artifact@v4
        if: always() && steps.policy.outcome == 'success' && needs.handoff.outputs.kind == 'online-shop'
        with:
          name: online-shop-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-evidence/
          if-no-files-found: warn
          retention-days: 90
